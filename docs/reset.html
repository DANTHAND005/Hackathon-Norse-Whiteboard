<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password · Norse Whiteboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; box-sizing: border-box;
    font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #17181C; background: #fff;
    background-image: radial-gradient(#E4E0D2 1.2px, transparent 1.2px); background-size: 24px 24px; }
  .card { width: 100%; max-width: 400px; box-sizing: border-box; background: #fff; border: 2px solid #17181C; border-radius: 24px;
    padding: 36px 32px; box-shadow: 8px 8px 0 #FFC72C; }
  h1 { margin: 0 0 20px; font: 800 28px 'Bricolage Grotesque', sans-serif; text-align: center; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  input { width: 100%; box-sizing: border-box; height: 50px; padding: 0 16px; border-radius: 12px; border: 2px solid #E9E6DC;
    background: #FCFBF7; font: 16px 'IBM Plex Sans', sans-serif; }
  input:focus { outline: none; border-color: #17181C; box-shadow: 0 0 0 4px rgba(255,199,44,.55); }
  button { width: 100%; margin-top: 18px; height: 54px; border: 2px solid #17181C; border-radius: 14px; background: #FFC72C;
    font: 700 17px 'IBM Plex Sans', sans-serif; box-shadow: 4px 4px 0 #17181C; cursor: pointer; }
  .msg { min-height: 20px; margin: 14px 0 0; font-size: 14px; text-align: center; }
  .err { color: #B42318; } .ok { color: #14633F; }
</style>
</head>
<body>
  <main class="card">
    <h1>Pick a new password</h1>
    <form id="reset">
      <label for="pass">New password</label>
      <input id="pass" type="password" autocomplete="new-password" minlength="8" required>
      <button type="submit">Save password</button>
      <p id="msg" class="msg" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    // The email link signs the user in with a one-time recovery session; we just set the new password.
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const msg = document.getElementById('msg');
    document.getElementById('reset').onsubmit = async e => {
      e.preventDefault();
      const { error } = await db.auth.updateUser({ password: document.getElementById('pass').value });
      msg.className = 'msg ' + (error ? 'err' : 'ok');
      msg.textContent = error ? error.message + ' (the link may have expired; request a new one)' : 'Saved. Taking you in…';
      if (!error) setTimeout(() => location.href = 'whiteboard.html', 1200);
    };
  </script>
</body>
</html>
